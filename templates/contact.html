{% extends "base.html" %}
{% block content %}

<h3 class="center-align">Contact Us</h3>

<div class="row">
    <form class="col s12 m8 offset-m2" method="POST">

        <!-- Name -->
        <div class="input-field col s12">
            <i class="fas fa-user prefix"></i>
            <input type="text" name="name" id="name" required>
            <label for="name">Your Name</label>
        </div>

        <!-- Email -->
        <div class="input-field col s12">
            <i class="fas fa-envelope prefix"></i>
            <input type="email" name="email" id="email" required>
            <label for="email">Your Email</label>
        </div>

        <!-- Message -->
        <div class="input-field col s12">
            <i class="fas fa-pencil-alt prefix"></i>
            <textarea name="message" id="message" class="materialize-textarea" required></textarea>
            <label for="message">Your Message</label>
        </div>

        <!-- Submit -->
        <div class="col s12 center-align">
            <button class="btn blue-grey lighten-1" type="submit">
                Send Message
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

    </form>
</div>

{% endblock %}
